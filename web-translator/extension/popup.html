<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>精準網頁翻譯</title>
<style>
  :root { color-scheme: light dark; --fg:#202124; --muted:#5f6368; --bg:#fff; --line:#e0e0e0; --accent:#1a73e8; --danger:#b00020; }
  @media (prefers-color-scheme: dark) { :root { --fg:#e8eaed; --muted:#9aa0a6; --bg:#202124; --line:#3c4043; --accent:#8ab4f8; --danger:#f28b82; } }
  body { margin:0; width:300px; font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans TC",sans-serif; color:var(--fg); background:var(--bg); }
  .wrap { padding:14px 16px 12px; }
  h1 { font-size:15px; margin:0 0 10px; display:flex; align-items:center; justify-content:space-between; }
  h1 a { font-size:12px; font-weight:normal; color:var(--accent); text-decoration:none; }
  .status { font-size:12px; color:var(--muted); min-height:18px; margin-bottom:10px; }
  .status.err { color:var(--danger); }
  button.primary { width:100%; padding:10px; border:0; border-radius:8px; background:var(--accent); color:#fff; font-size:14px; font-weight:600; cursor:pointer; }
  button.primary[disabled] { opacity:.5; cursor:default; }
  button.secondary { width:100%; margin-top:8px; padding:8px; border:1px solid var(--line); border-radius:8px; background:transparent; color:var(--fg); cursor:pointer; }
  .row { display:flex; align-items:center; justify-content:space-between; margin-top:10px; font-size:13px; }
  .seg { display:inline-flex; border:1px solid var(--line); border-radius:6px; overflow:hidden; }
  .seg label { padding:3px 10px; cursor:pointer; font-size:12px; }
  .seg input { display:none; }
  .seg input:checked + span { background:var(--accent); color:#fff; }
  .seg label span { display:block; margin:-3px -10px; padding:3px 10px; }
  .toggle { display:flex; align-items:center; gap:6px; cursor:pointer; white-space:nowrap; }
  #host { display:inline-block; max-width:150px; overflow:hidden; text-overflow:ellipsis; vertical-align:bottom; }
  hr { border:0; border-top:1px solid var(--line); margin:12px 0 8px; }
  .hint { font-size:12px; color:var(--muted); }
  .hint a { color:var(--accent); }
  kbd { font:11px monospace; border:1px solid var(--line); border-radius:4px; padding:0 4px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>精準網頁翻譯 <a href="#" id="openOptions">設定</a></h1>
  <div class="status" id="status">正在讀取…</div>
  <button class="primary" id="mainBtn" disabled>翻譯此頁</button>
  <button class="secondary" id="retryBtn" style="display:none">重試失敗的段落</button>

  <div class="row">
    <span>顯示方式</span>
    <span class="seg" id="modeSeg">
      <label><input type="radio" name="mode" value="replace"><span>取代原文</span></label>
      <label><input type="radio" name="mode" value="bilingual"><span>雙語對照</span></label>
    </span>
  </div>
  <div class="row">
    <label class="toggle"><input type="checkbox" id="autoSite"> 總是翻譯 <b id="host"></b></label>
  </div>
  <div class="row" id="autoLangRow" style="display:none">
    <label class="toggle"><input type="checkbox" id="autoLang"> 總是翻譯<span id="langName">此語言</span>的網頁</label>
  </div>
  <hr>
  <div class="hint" id="hint">快捷鍵 <kbd>Alt</kbd>+<kbd>T</kbd> 可切換翻譯／原文。</div>
</div>
<script src="popup.js"></script>
</body>
</html>
