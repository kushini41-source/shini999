<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>網站繁體中文化</title>
<style>
  body { font: 13px/1.5 "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif; width: 380px; margin: 0; padding: 12px; color: #222; }
  h1 { font-size: 15px; margin: 0 0 8px; }
  h2 { font-size: 13px; margin: 14px 0 6px; border-top: 1px solid #ddd; padding-top: 10px; }
  .row { display: flex; gap: 6px; align-items: center; margin: 4px 0; }
  .row .en { flex: 1; word-break: break-word; color: #555; }
  input[type=text] { flex: 1; padding: 4px 6px; border: 1px solid #bbb; border-radius: 4px; min-width: 0; }
  button { padding: 4px 8px; border: 1px solid #2362c9; background: #2362c9; color: #fff; border-radius: 4px; cursor: pointer; }
  button.ghost { background: #fff; color: #2362c9; }
  .list { max-height: 220px; overflow-y: auto; }
  .hint { color: #777; font-size: 12px; }
  #msg { color: #1a7f37; min-height: 1em; }
</style>
</head>
<body>
  <h1>網站繁體中文化（Buffer、GitHub）</h1>
  <label class="row"><input type="checkbox" id="enabled"> 啟用中文化</label>

  <h2>新增或修改翻譯</h2>
  <div class="row"><input type="text" id="newEn" placeholder="英文原文（完全相同）"></div>
  <div class="row"><input type="text" id="newZh" placeholder="中文翻譯"><button id="add">儲存</button></div>
  <div id="msg"></div>

  <h2>尚未翻譯的文字 <span class="hint">（在 Buffer、GitHub 頁面上看到的）</span></h2>
  <div class="row"><input type="text" id="filter" placeholder="篩選…"><button class="ghost" id="clearMissing">清空</button></div>
  <div class="list" id="missing"></div>

  <h2>我的自訂翻譯 <span class="hint">（已同步到雲端）</span></h2>
  <div class="list" id="custom"></div>

  <h2>備份</h2>
  <div class="row">
    <button class="ghost" id="export">匯出 JSON</button>
    <button class="ghost" id="exportMissing">匯出未翻譯清單</button>
    <label class="ghost" style="cursor:pointer;color:#2362c9">匯入 JSON<input type="file" id="import" accept=".json" hidden></label>
  </div>
  <p class="hint">自訂翻譯存在 Chrome 同步空間，只要在另一台電腦用同一個 Google 帳號登入 Chrome 並安裝本擴充功能，就會自動帶過去。</p>
  <script src="dict.js"></script>
  <script src="dict-github.js"></script>
  <script src="popup.js"></script>
</body>
</html>
